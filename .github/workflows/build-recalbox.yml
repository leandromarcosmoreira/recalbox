name: Recalbox Build

on:
  workflow_dispatch:
    inputs:
      skip_cache:
        description: 'Skip caches'
        required: false
        default: 'false'
        type: boolean
      force_rebuild:
        description: 'Force rebuild'
        required: false
        default: 'false'
        type: boolean
      architectures:
        description: 'Architectures'
        required: false
        default: 'x86_64'
        type: string

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  GH_CLI_VERSION: '2.65.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect_changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      needs_toolchain: ${{ steps.detect.outputs.needs_toolchain }}
      needs_system: ${{ steps.detect.outputs.needs_system }}
      needs_packages: ${{ steps.detect.outputs.needs_packages }}
      needs_image: ${{ steps.detect.outputs.needs_image }}
      diff_hash: ${{ steps.detect.outputs.diff_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get previous commit
        id: prev_commit
        run: |
          PREV_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "prev_commit=$PREV_COMMIT" >> $GITHUB_OUTPUT

      - name: Detect changes
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ steps.prev_commit.outputs.prev_commit }}...HEAD 2>/dev/null || echo "")
          
          NEEDS_TOOLCHAIN=false
          NEEDS_SYSTEM=false
          NEEDS_PACKAGES=false
          NEEDS_IMAGE=true
          
          if [ -z "$CHANGED_FILES" ]; then
            NEEDS_TOOLCHAIN=false
            NEEDS_SYSTEM=false
            NEEDS_PACKAGES=false
          elif echo "$CHANGED_FILES" | grep -qE '^(toolchain/|package/.*/toolchain|Config.in|configs/|scripts/buildroot)'; then
            NEEDS_TOOLCHAIN=true
            NEEDS_SYSTEM=true
            NEEDS_PACKAGES=true
          elif echo "$CHANGED_FILES" | grep -qE '^board/'; then
            NEEDS_SYSTEM=true
            NEEDS_PACKAGES=true
          elif echo "$CHANGED_FILES" | grep -qE '^package/'; then
            NEEDS_PACKAGES=true
          fi
          
          if [ "${{ inputs.force_rebuild }}" == "true" ]; then
            NEEDS_TOOLCHAIN=true
            NEEDS_SYSTEM=true
            NEEDS_PACKAGES=true
          fi
          
          echo "needs_toolchain=$NEEDS_TOOLCHAIN" >> $GITHUB_OUTPUT
          echo "needs_system=$NEEDS_SYSTEM" >> $GITHUB_OUTPUT
          echo "needs_packages=$NEEDS_PACKAGES" >> $GITHUB_OUTPUT
          echo "needs_image=$NEEDS_IMAGE" >> $GITHUB_OUTPUT
          echo "diff_hash=${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT

  prepare:
    name: Prepare Environment
    runs-on: ubuntu-latest
    needs: detect_changes
    outputs:
      date: ${{ steps.version.outputs.date }}
      slug: ${{ steps.version.outputs.slug }}
      build_id: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Ensure buildroot
        run: |
          if [ ! -d buildroot ]; then
            git clone --depth 1 --branch 2024.02 https://git.busybox.net/buildroot buildroot
          fi
          cd buildroot
          git fetch --depth 1 origin e4a5ab3b319753f41e2b5cf22e90b6b0304ca225
          git checkout e4a5ab3b319753f41e2b5cf22e90b6b0304ca225

      - name: Version info
        id: version
        run: |
          echo "date=$(date '+%Y%m%d')" >> $GITHUB_OUTPUT
          echo "slug=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT

      - name: Cache buildroot downloads
        if: ${{ !inputs.skip_cache }}
        uses: actions/cache@v4
        with:
          path: buildroot/dl
          key: buildroot-dl-${{ github.runner_os }}
          restore-keys: buildroot-dl-${{ github.runner_os }}-

      - name: Cache ccache
        if: ${{ !inputs.skip_cache }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: recalbox-ccache-${{ github.runner_os }}-${{ needs.detect_changes.outputs.diff_hash }}
          restore-keys: recalbox-ccache-${{ github.runner_os }}-

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recalbox-build:latest
          cache-from: type=gha,scope=recalbox
          cache-to: type=gha,mode=max,scope=recalbox

      - name: Save Docker image
        run: docker save recalbox-build:latest -o recalbox-build.tar

      - name: Upload environment
        uses: actions/upload-artifact@v4
        with:
          name: environment-${{ github.run_id }}
          path: recalbox-build.tar
          retention-days: 2

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: [detect_changes, prepare]
    if: |
      needs.detect_changes.outputs.needs_toolchain == 'true' ||
      needs.detect_changes.outputs.needs_system == 'true' ||
      needs.detect_changes.outputs.needs_packages == 'true' ||
      needs.detect_changes.outputs.needs_image == 'true' ||
      inputs.force_rebuild == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
          - arch: rpi5_64
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Download environment
        uses: actions/download-artifact@v4
        with:
          name: environment-${{ needs.prepare.outputs.build_id }}
          path: .

      - name: Load Docker
        run: docker load -i recalbox-build.tar

      - name: Cache build output
        if: ${{ !inputs.skip_cache }}
        uses: actions/cache@v4
        with:
          path: buildroot/output
          key: build-${{ matrix.arch }}-${{ github.runner_os }}-${{ needs.detect_changes.outputs.diff_hash }}
          restore-keys: build-${{ matrix.arch }}-${{ github.runner_os }}-

      - name: Build all
        run: |
          set -e
          docker run --rm --security-opt seccomp=unconfined \
            -v "$(pwd):/work" \
            -e "ARCH=${{ matrix.arch }}" \
            -e "FORCE_UNSAFE_CONFIGURE=1" \
            -e "RECALBOX_CCACHE_ENABLED=1" \
            -v "${HOME}/.ccache:/share/ccache" \
            recalbox-build:latest \
            make BR2_DL_DIR="/share/dl" 2>&1 | tee build-${{ matrix.arch }}.log

      - name: Prepare artifacts
        run: |
          if [ -f "output/images/recalbox/recalbox.img" ]; then
            mkdir -p dist-${{ matrix.arch }}
            cp output/images/recalbox/* dist-${{ matrix.arch }}/
            cp build-${{ matrix.arch }}.log dist-${{ matrix.arch }}/
            cd dist-${{ matrix.arch }}
            sha256sum * > SHA256SUMS.txt
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}-${{ needs.detect_changes.outputs.diff_hash }}
          path: dist-${{ matrix.arch }}/
          retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: always()
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: |
          for arch in x86_64 rpi5_64; do
            echo "=== $arch ==="
            ls -lh dist-$arch/ 2>/dev/null || echo "No artifacts"
          done

      - name: Install GH CLI
        uses: dev-hanz-ops/install-gh-cli-action@v0.2.1
        with:
          gh-cli-version: ${{ env.GH_CLI_VERSION }}

      - name: Create releases
        if: needs.build.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.date }}"
          
          for arch in x86_64 rpi5_64; do
            ARCH_DIR="dist-$arch"
            ARCH_TAG=$(echo "$arch" | sed 's/_/./g')
            
            if [ -d "$ARCH_DIR" ] && [ -f "$ARCH_DIR/recalbox.img" ]; then
              TAG="v${VERSION}-${ARCH_TAG}"
              echo "Creating release: $TAG"
              
              cat > release_notes.md << 'EOFRELEASE'
              # Recalbox Build

              ## Downloads

              | File | SHA256 |
              |------|--------|
              EOFRELEASE

              for f in "$ARCH_DIR"/*.img "$ARCH_DIR"/*.zip; do
                if [ -f "$f" ]; then
                  SHASUM=$(sha256sum "$f" | cut -d' ' -f1)
                  echo "| $(basename $f) | \`$SHASUM\` |" >> release_notes.md
                fi
              done

              gh release create "$TAG" "$ARCH_DIR"/* \
                --title "Recalbox $VERSION ($arch)" \
                --notes-file release_notes.md
            fi
          done

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Detect | ${{ needs.detect_changes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Prepare | ${{ needs.prepare.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ${{ needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
