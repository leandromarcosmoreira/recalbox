name: Recalbox Build

on:
  workflow_dispatch:
    inputs:
      skip_cache:
        description: 'Pular caches'
        required: false
        default: 'false'
        type: boolean
      force_rebuild:
        description: 'Forçar rebuild'
        required: false
        default: 'false'
        type: boolean
      architectures:
        description: 'Arquiteturas'
        required: false
        default: 'x86_64'
        type: string

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  GH_CLI_VERSION: '2.65.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detectar_alteracoes:
    name: Detectar Alteracoes
    runs-on: ubuntu-latest
    outputs:
      needs_toolchain: ${{ steps.detectar.outputs.needs_toolchain }}
      needs_system: ${{ steps.detectar.outputs.needs_system }}
      needs_packages: ${{ steps.detectar.outputs.needs_packages }}
      needs_image: ${{ steps.detectar.outputs.needs_image }}
      diff_hash: ${{ steps.detectar.outputs.diff_hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obter commit anterior
        id: commit_anterior
        run: |
          PREV_COMMIT=$(git rev-parse HEAD~1 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "prev_commit=$PREV_COMMIT" >> $GITHUB_OUTPUT

      - name: Detectar alteracoes
        id: detectar
        run: |
          CHANGED_FILES=$(git diff --name-only ${{ steps.commit_anterior.outputs.prev_commit }}...HEAD 2>/dev/null || echo "")
          
          NEEDS_TOOLCHAIN=false
          NEEDS_SYSTEM=false
          NEEDS_PACKAGES=false
          NEEDS_IMAGE=true
          
          if [ -z "$CHANGED_FILES" ]; then
            NEEDS_TOOLCHAIN=false
            NEEDS_SYSTEM=false
            NEEDS_PACKAGES=false
          elif echo "$CHANGED_FILES" | grep -qE '^(toolchain/|package/.*/toolchain|Config.in|configs/|scripts/buildroot)'; then
            NEEDS_TOOLCHAIN=true
            NEEDS_SYSTEM=true
            NEEDS_PACKAGES=true
          elif echo "$CHANGED_FILES" | grep -qE '^board/'; then
            NEEDS_SYSTEM=true
            NEEDS_PACKAGES=true
          elif echo "$CHANGED_FILES" | grep -qE '^package/'; then
            NEEDS_PACKAGES=true
          fi
          
          if [ "${{ inputs.force_rebuild }}" == "true" ]; then
            NEEDS_TOOLCHAIN=true
            NEEDS_SYSTEM=true
            NEEDS_PACKAGES=true
          fi
          
          echo "needs_toolchain=$NEEDS_TOOLCHAIN" >> $GITHUB_OUTPUT
          echo "needs_system=$NEEDS_SYSTEM" >> $GITHUB_OUTPUT
          echo "needs_packages=$NEEDS_PACKAGES" >> $GITHUB_OUTPUT
          echo "needs_image=$NEEDS_IMAGE" >> $GITHUB_OUTPUT
          echo "diff_hash=${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT

  preparar:
    name: Preparar Ambiente
    runs-on: ubuntu-latest
    needs: detectar_alteracoes
    outputs:
      date: ${{ steps.versao.outputs.date }}
      slug: ${{ steps.versao.outputs.slug }}
      build_id: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Garantir buildroot
        run: |
          if [ ! -d buildroot ]; then
            git clone --depth 1 --branch 2024.02 https://git.busybox.net/buildroot buildroot
          fi
          cd buildroot
          git fetch --depth 1 origin e4a5ab3b319753f41e2b5cf22e90b6b0304ca225
          git checkout e4a5ab3b319753f41e2b5cf22e90b6b0304ca225

      - name: Info versao
        id: versao
        run: |
          echo "date=$(date '+%Y%m%d')" >> $GITHUB_OUTPUT
          echo "slug=${GITHUB_REF_NAME//\//-}" >> $GITHUB_OUTPUT

      - name: Cache downloads buildroot
        if: ${{ !inputs.skip_cache }}
        uses: actions/cache@v4
        with:
          path: buildroot/dl
          key: buildroot-dl-${{ github.runner_os }}
          restore-keys: buildroot-dl-${{ github.runner_os }}-

      - name: Cache ccache
        if: ${{ !inputs.skip_cache }}
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: recalbox-ccache-${{ github.runner_os }}-${{ needs.detectar_alteracoes.outputs.diff_hash }}
          restore-keys: recalbox-ccache-${{ github.runner_os }}-

      - name: Build imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recalbox-build:latest
          cache-from: type=gha,scope=recalbox
          cache-to: type=gha,mode=max,scope=recalbox

      - name: Salvar imagem Docker
        run: docker save recalbox-build:latest -o recalbox-build.tar

      - name: Upload ambiente
        uses: actions/upload-artifact@v4
        with:
          name: ambiente-${{ github.run_id }}
          path: |
            recalbox-build.tar
            buildroot/
          retention-days: 2

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: [detectar_alteracoes, preparar]
    if: |
      needs.detectar_alteracoes.outputs.needs_toolchain == 'true' ||
      needs.detectar_alteracoes.outputs.needs_system == 'true' ||
      needs.detectar_alteracoes.outputs.needs_packages == 'true' ||
      needs.detectar_alteracoes.outputs.needs_image == 'true' ||
      inputs.force_rebuild == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
          - arch: rpi5_64
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Download ambiente
        uses: actions/download-artifact@v4
        with:
          name: ambiente-${{ needs.preparar.outputs.build_id }}
          path: .

      - name: Setup buildroot
        run: |
          if [ -d "buildroot" ]; then
            echo "Buildroot restaurado do cache"
          fi

      - name: Carregar Docker
        run: docker load -i recalbox-build.tar

      - name: Cache output build
        if: ${{ !inputs.skip_cache }}
        uses: actions/cache@v4
        with:
          path: buildroot/output
          key: build-${{ matrix.arch }}-${{ github.runner_os }}-${{ needs.detectar_alteracoes.outputs.diff_hash }}
          restore-keys: build-${{ matrix.arch }}-${{ github.runner_os }}-

      - name: Build tudo
        run: |
          set -e
          
          if [ ! -d "buildroot" ]; then
            echo "Clonando buildroot..."
            git clone --depth 1 --branch 2024.02 https://git.busybox.net/buildroot buildroot
            cd buildroot
            git fetch --depth 1 origin e4a5ab3b319753f41e2b5cf22e90b6b0304ca225
            git checkout e4a5ab3b319753f41e2b5cf22e90b6b0304ca225
            cd ..
          fi
          
          if [ ! -f "buildroot/.config" ]; then
            echo "Configurando buildroot para ${{ matrix.arch }}..."
            cp configs/recalbox-${{ matrix.arch }}_defconfig buildroot/configs/
            make -C buildroot recalbox-${{ matrix.arch }}_defconfig
          fi
          
          docker run --rm --security-opt seccomp=unconfined \
            -v "$(pwd):/work" \
            -e "ARCH=${{ matrix.arch }}" \
            -e "FORCE_UNSAFE_CONFIGURE=1" \
            -e "RECALBOX_CCACHE_ENABLED=1" \
            -v "${HOME}/.ccache:/share/ccache" \
            recalbox-build:latest \
            make -C buildroot BR2_DL_DIR="/share/dl" 2>&1 | tee build-${{ matrix.arch }}.log

      - name: Preparar artefatos
        run: |
          if [ -f "buildroot/output/images/recalbox/recalbox.img" ]; then
            mkdir -p dist-${{ matrix.arch }}
            cp buildroot/output/images/recalbox/* dist-${{ matrix.arch }}/
            cp build-${{ matrix.arch }}.log dist-${{ matrix.arch }}/
            cd dist-${{ matrix.arch }}
            sha256sum * > SHA256SUMS.txt
          else
            echo "Build output nao encontrado"
            ls -la buildroot/output/images/ 2>/dev/null || echo "Diretorio output nao existe"
          fi

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: imagem-${{ matrix.arch }}-${{ needs.detectar_alteracoes.outputs.diff_hash }}
          path: dist-${{ matrix.arch }}/
          retention-days: 7

  release:
    name: Criar Release
    runs-on: ubuntu-latest
    needs: [detectar_alteracoes, preparar, build]
    if: always()
    outputs:
      diff_hash: ${{ needs.detectar_alteracoes.outputs.diff_hash }}
    steps:
      - name: Baixar artefatos de imagem
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: imagem-*
          merge-multiple: true

      - name: Mostrar artefatos baixados
        run: |
          for arch in x86_64 rpi5_64; do
            echo "=== $arch ==="
            ls -lh dist-$arch/ 2>/dev/null || echo "Sem artefatos para $arch"
          done

      - name: Instalar GH CLI
        uses: dev-hanz-ops/install-gh-cli-action@v0.2.1
        with:
          gh-cli-version: ${{ env.GH_CLI_VERSION }}

      - name: Criar releases
        if: needs.build.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.preparar.outputs.date }}"
          DATETIME=$(date '+%Y-%m-%d %H:%M:%S')
          COMMIT="${{ github.sha }}"
          
          for arch in x86_64 rpi5_64; do
            ARCH_DIR="dist-$arch"
            
            ARCH_DISPLAY=""
            ARCH_DESCRIPTION=""
            case "$arch" in
              x86_64)
                ARCH_DISPLAY="PC (x86_64)"
                ARCH_DESCRIPTION="Para PCs e notebooks com processador Intel ou AMD"
                ;;
              rpi5_64)
                ARCH_DISPLAY="Raspberry Pi 5"
                ARCH_DESCRIPTION="Para Raspberry Pi 5 (8GB recomendado)"
                ;;
            esac
            
            if [ -d "$ARCH_DIR" ] && [ -f "$ARCH_DIR/recalbox.img" ]; then
              TAG="v${VERSION}-${arch}"
              echo "Criando release: $TAG"
              
              FILE_SIZE=$(stat -c%s "$ARCH_DIR/recalbox.img" | numfmt --to=iec-i --suffix=B)
              
              cat > notas_release.md << 'EOFRELEASE'
              # Recalbox - O console retrogaming tudo-em-um
              
              ## Instale em seu hardware
              
              Versão gratuita do Recalbox para instalação em seu hardware!
              
              ## Requisitos do Sistema
              
              EOFRELEASE
              
              echo "**Arquitetura:** ${ARCH_DISPLAY}" >> notas_release.md
              echo "" >> notas_release.md
              echo "${ARCH_DESCRIPTION}" >> notas_release.md
              echo "" >> notas_release.md
              echo "---" >> notas_release.md
              echo "" >> notas_release.md
              echo "## Downloads" >> notas_release.md
              echo "" >> notas_release.md
              echo "| Arquivo | Tamanho | SHA256 |" >> notas_release.md
              echo "|---------|---------|--------|" >> notas_release.md
              
              for f in "$ARCH_DIR"/*.img "$ARCH_DIR"/*.zip; do
                if [ -f "$f" ]; then
                  FILENAME=$(basename "$f")
                  FILESIZE=$(stat -c%s "$f" | numfmt --to=iec-i --suffix=B)
                  SHASUM=$(sha256sum "$f" | cut -d' ' -f1)
                  echo "| ${FILENAME} | ${FILESIZE} | \`${SHASUM}\` |" >> notas_release.md
                fi
              done
              
              echo "" >> notas_release.md
              echo "---" >> notas_release.md
              echo "" >> notas_release.md
              echo "## Informações do Build" >> notas_release.md
              echo "" >> notas_release.md
              echo "- **Versão:** ${VERSION}" >> notas_release.md
              echo "- **Data:** ${DATETIME}" >> notas_release.md
              echo "- **Commit:** \`${COMMIT:0:8}\`" >> notas_release.md
              echo "- **Workflow:** #${GITHUB_RUN_NUMBER}" >> notas_release.md
              echo "" >> notas_release.md
              echo "---" >> notas_release.md
              echo "" >> notas_release.md
              echo "## Como Instalar" >> notas_release.md
              echo "" >> notas_release.md
              echo "1. Baixe a imagem para sua arquitetura" >> notas_release.md
              echo "2. Descompacte o arquivo .img.gz" >> notas_release.md
              echo "3. Use obalenaEtcher ou Raspberry Pi Imager para gravar em um SD card ou USB" >> notas_release.md
              echo "4. Boot e aproveite!" >> notas_release.md
              echo "" >> notas_release.md
              echo "Para mais informações, visite: [wiki.recalbox.com](https://wiki.recalbox.com/)" >> notas_release.md
              
              gh release create "$TAG" "$ARCH_DIR"/* \
                --title "Recalbox ${VERSION} (${ARCH_DISPLAY})" \
                --notes-file notas_release.md
                
              echo "Release criado para $arch"
            fi
          done

      - name: Resumo
        run: |
          echo "## Resumo do Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Etapa | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Detectar | ${{ needs.detectar_alteracoes.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Preparar | ${{ needs.preparar.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release | ${{ needs.release.result }} |" >> $GITHUB_STEP_SUMMARY
