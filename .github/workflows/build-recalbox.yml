name: Recalbox Build

on:
  workflow_dispatch:
    inputs:
      skip_cache:
        description: 'Pular caches'
        required: false
        default: 'false'
        type: boolean
      force_rebuild:
        description: 'Forçar rebuild completo'
        required: false
        default: 'false'
        type: boolean
      arch:
        description: 'Arquitetura'
        required: false
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - rpi5_64
          - rpi4_64
          - rpi3
          - rpizero2
          - rg353x
          - odroidgo2

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  GH_CLI_VERSION: '2.65.0'

jobs:
  detectar_estado:
    name: Verificar Estado
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.determinar.outputs.stage }}
      has_image: ${{ steps.determinar.outputs.has_image }}
      has_packages: ${{ steps.determinar.outputs.has_packages }}
      has_kernel: ${{ steps.determinar.outputs.has_kernel }}
      has_defconfig: ${{ steps.determinar.outputs.has_defconfig }}
      has_prepare: ${{ steps.determinar.outputs.has_prepare }}
      recalbox_arch: ${{ steps.mapeamento.outputs.linux_arch }}
    steps:
      - name: Mapeamento de arquitetura
        id: mapeamento
        run: |
          ARCH="${{ inputs.arch }}"
          case "$ARCH" in
            x86_64)      LINUX_ARCH="x86_64" ;;
            rpi5_64)     LINUX_ARCH="aarch64" ;;
            rpi4_64)     LINUX_ARCH="aarch64" ;;
            rpi3)        LINUX_ARCH="armv7" ;;
            rpizero2)    LINUX_ARCH="armv7" ;;
            rg353x)      LINUX_ARCH="aarch64" ;;
            odroidgo2)   LINUX_ARCH="aarch64" ;;
            *)           LINUX_ARCH="$ARCH" ;;
          esac
          echo "linux_arch=$LINUX_ARCH" >> $GITHUB_OUTPUT
          echo "Arquitetura: $ARCH -> $LINUX_ARCH"

      - name: Obter lista de artefatos
        id: listar
        run: |
          # Instalar aria2 se necessário
          if ! command -v aria2c &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y aria2 jq
          fi
          
          if [ "${{ inputs.skip_cache }}" = "true" ]; then
            echo "skip_cache=true" >> $GITHUB_OUTPUT
          fi
          
          ARCH="${{ inputs.arch }}"
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "force_rebuild=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Buscar artefatos via API do GitHub usando aria2c
          aria2c --quiet=true \
            --header="Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            --header="Accept: application/vnd.github+json" \
            -d /tmp -o artifacts.json \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts?per_page=100"
          
          # Lista apenas nomes para debug
          echo "Artefatos encontrados:" >> $GITHUB_STEP_SUMMARY
          jq -r '.artifacts[].name' /tmp/artifacts.json >> $GITHUB_STEP_SUMMARY || true

      - name: Determinar próximo estágio
        id: determinar
        run: |
          # Instalar jq
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          
          ARCH="${{ inputs.arch }}"
          
          # Force rebuild ignora todos os caches
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "stage=prepare" >> $GITHUB_OUTPUT
            echo "has_prepare=false" >> $GITHUB_OUTPUT
            echo "has_defconfig=false" >> $GITHUB_OUTPUT
            echo "has_kernel=false" >> $GITHUB_OUTPUT
            echo "has_packages=false" >> $GITHUB_OUTPUT
            echo "has_image=false" >> $GITHUB_OUTPUT
            echo "DEBUG: force_rebuild=true, starting from prepare" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          # Skip cache ignora apenas os estágios intermediários
          if [ "${{ inputs.skip_cache }}" = "true" ]; then
            echo "stage=defconfig" >> $GITHUB_OUTPUT
            echo "has_prepare=true" >> $GITHUB_OUTPUT
            echo "has_defconfig=false" >> $GITHUB_OUTPUT
            echo "has_kernel=false" >> $GITHUB_OUTPUT
            echo "has_packages=false" >> $GITHUB_OUTPUT
            echo "has_image=false" >> $GITHUB_OUTPUT
            echo "DEBUG: skip_cache=true, starting from defconfig" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          # Verificar se arquivo de artefatos existe
          if [ ! -f /tmp/artifacts.json ]; then
            echo "stage=prepare" >> $GITHUB_OUTPUT
            echo "DEBUG: no artifacts file, starting from prepare" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          RESPONSE=$(cat /tmp/artifacts.json)
          
          # Verificar se response tem dados
          if [ -z "$RESPONSE" ] || [ "$RESPONSE" = "null" ]; then
            echo "stage=prepare" >> $GITHUB_OUTPUT
            echo "DEBUG: empty response, starting from prepare" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          # Extrair lista de nomes
          ARTIFACTS=$(echo "$RESPONSE" | jq -r '.artifacts[].name' 2>/dev/null)
          
          # Debug: mostrar artefatos encontrados
          echo "DEBUG: Artefatos encontrados para ${ARCH}:" >> $GITHUB_STEP_SUMMARY
          echo "$ARTIFACTS" | grep "${ARCH}" >> $GITHUB_STEP_SUMMARY || echo "  Nenhum artefato encontrado para ${ARCH}" >> $GITHUB_STEP_SUMMARY
          
          # Verificar artefatos - definir stage baseado no que existe
          # Verificar em ordem reversa (do mais completo ao menos completo)
          if echo "$ARTIFACTS" | grep -q "^imagem-${ARCH}$"; then
            echo "stage=done" >> $GITHUB_OUTPUT
            echo "has_image=true" >> $GITHUB_OUTPUT
            echo "DEBUG: found imagem-${ARCH}, stage=done" >> $GITHUB_STEP_SUMMARY
          elif echo "$ARTIFACTS" | grep -q "^build-packages-${ARCH}$"; then
            echo "stage=image" >> $GITHUB_OUTPUT
            echo "DEBUG: found build-packages-${ARCH}, stage=image" >> $GITHUB_STEP_SUMMARY
          elif echo "$ARTIFACTS" | grep -q "^build-kernel-${ARCH}$"; then
            echo "stage=packages" >> $GITHUB_OUTPUT
            echo "DEBUG: found build-kernel-${ARCH}, stage=packages" >> $GITHUB_STEP_SUMMARY
          elif echo "$ARTIFACTS" | grep -q "^buildroot-defconfig-${ARCH}$"; then
            echo "stage=kernel" >> $GITHUB_OUTPUT
            echo "DEBUG: found buildroot-defconfig-${ARCH}, stage=kernel" >> $GITHUB_STEP_SUMMARY
          elif echo "$ARTIFACTS" | grep -q "^buildroot-prepare-${ARCH}$"; then
            echo "stage=defconfig" >> $GITHUB_OUTPUT
            echo "DEBUG: found buildroot-prepare-${ARCH}, stage=defconfig" >> $GITHUB_STEP_SUMMARY
          else
            echo "stage=prepare" >> $GITHUB_OUTPUT
            echo "DEBUG: no artifacts found for ${ARCH}, stage=prepare" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Debug - mostrar stage final
          STAGE=$(grep "^stage=" $GITHUB_OUTPUT | tail -1 | cut -d= -f2)
          echo "DEBUG: Stage final = $STAGE" >> $GITHUB_STEP_SUMMARY

  prepare:
    name: "[1/5] Preparar Ambiente"
    runs-on: ubuntu-latest
    needs: detectar_estado
    if: needs.detectar_estado.outputs.stage == 'prepare'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar cache existente
        uses: actions/download-artifact@v4
        with:
          name: buildroot-prepare-${{ inputs.arch }}
          path: . 
        continue-on-error: true

      - name: Clonar/Verificar buildroot
        run: |
          if [ ! -d "buildroot" ] || [ ! -f "buildroot/Makefile" ]; then
            echo "Clonando buildroot..."
            rm -rf buildroot
            git clone --depth 1 --branch 2024.02 https://git.busybox.net/buildroot buildroot
            cd buildroot
            git fetch --depth 1 origin e4a5ab3b319753f41e2b5cf22e90b6b0304ca225
            git checkout e4a5ab3b319753f41e2b5cf22e90b6b0304ca225
            cd ..
          else
            echo "Buildroot já existe, reutilizando..."
          fi
          
          chmod +x buildroot/support/scripts/* buildroot/scripts/* 2>/dev/null || true
          mkdir -p output dl

      - name: Criar cache
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-prepare-${{ inputs.arch }}
          path: |
            buildroot/
            output/
            dl/
          retention-days: 7

  defconfig:
    name: "[2/5] Configurar Build"
    runs-on: ubuntu-latest
    needs: [prepare, detectar_estado]
    if: needs.detectar_estado.outputs.stage != 'done'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar cache prepare
        uses: actions/download-artifact@v4
        with:
          name: buildroot-prepare-${{ inputs.arch }}
          path: .
        continue-on-error: true

      - name: Corrigir permissões
        run: |
          chmod -R 777 buildroot output dl 2>/dev/null || true
          chmod +x buildroot/support/scripts/* buildroot/scripts/* 2>/dev/null || true

      - name: Baixar cache defconfig existente
        uses: actions/download-artifact@v4
        with:
          name: buildroot-defconfig-${{ inputs.arch }}
          path: .
        continue-on-error: true

      - name: Build Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recalbox-build:latest
          cache-from: type=gha,scope=recalbox
          cache-to: type=gha,mode=max,scope=recalbox

      - name: Executar defconfig
        if: needs.detectar_estado.outputs.has_defconfig != 'true'
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -v "$(pwd):/recalbox" \
            -w /recalbox \
            -e "ARCH=${{ needs.detectar_estado.outputs.recalbox_arch }}" \
            -e "BR2_EXTERNAL=/recalbox" \
            -e "BR2_PACKAGE_OVERRIDE_FILE=/recalbox/local.mk" \
            -e "O=/recalbox/output" \
            -e "BR2_DL_DIR=/recalbox/dl" \
            recalbox-build:latest \
            make recalbox-${{ inputs.arch }}_defconfig 2>&1 | tee defconfig.log

      - name: Salvar cache defconfig
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-defconfig-${{ inputs.arch }}
          path: |
            output/.config
            output/Makefile
            defconfig.log
          retention-days: 7

  kernel:
    name: "[3/5] Compilar Kernel"
    runs-on: ubuntu-latest
    needs: [defconfig, detectar_estado]
    if: needs.detectar_estado.outputs.stage != 'done'
    steps:
      - uses: actions/checkout@v4

      - name: Baixar caches
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: "buildroot-*"
          merge-multiple: true
        continue-on-error: true

      - name: Baixar cache defconfig
        uses: actions/download-artifact@v4
        with:
          name: buildroot-defconfig-${{ inputs.arch }}
          path: .
        continue-on-error: true

      - name: Corrigir permissões
        run: |
          chmod -R 777 buildroot output dl 2>/dev/null || true
          chmod +x buildroot/support/scripts/* buildroot/scripts/* 2>/dev/null || true

      - name: Build Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recalbox-build:latest

      - name: Compilar kernel
        if: needs.detectar_estado.outputs.has_kernel != 'true'
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -v "$(pwd):/recalbox" \
            -w /recalbox \
            -e "ARCH=${{ needs.detectar_estado.outputs.recalbox_arch }}" \
            -e "FORCE_UNSAFE_CONFIGURE=1" \
            -e "BR2_EXTERNAL=/recalbox" \
            -e "BR2_PACKAGE_OVERRIDE_FILE=/recalbox/local.mk" \
            -e "O=/recalbox/output" \
            -e "BR2_DL_DIR=/recalbox/dl" \
            -v "${HOME}/.ccache:/share/ccache" \
            recalbox-build:latest \
            make -C buildroot BR2_DL_DIR="/recalbox/dl" linux 2>&1 | tee kernel.log

      - name: Salvar cache kernel
        uses: actions/upload-artifact@v4
        with:
          name: build-kernel-${{ inputs.arch }}
          path: |
            output/build/
            kernel.log
          retention-days: 7

  packages:
    name: "[4/5] Compilar Pacotes"
    runs-on: ubuntu-latest
    needs: [kernel, detectar_estado]
    if: needs.detectar_estado.outputs.stage != 'done'
    steps:
      - uses: actions/checkout@v4

      - name: Baixar todos os caches
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: "build*"
          merge-multiple: true
        continue-on-error: true

      - name: Baixar cache defconfig
        uses: actions/download-artifact@v4
        with:
          name: buildroot-defconfig-${{ inputs.arch }}
          path: .
        continue-on-error: true

      - name: Corrigir permissões
        run: |
          chmod -R 777 buildroot output dl 2>/dev/null || true
          chmod +x buildroot/support/scripts/* buildroot/scripts/* 2>/dev/null || true

      - name: Build Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recalbox-build:latest

      - name: Compilar pacotes
        if: needs.detectar_estado.outputs.has_packages != 'true'
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -v "$(pwd):/recalbox" \
            -w /recalbox \
            -e "ARCH=${{ needs.detectar_estado.outputs.recalbox_arch }}" \
            -e "FORCE_UNSAFE_CONFIGURE=1" \
            -e "RECALBOX_CCACHE_ENABLED=1" \
            -e "BR2_EXTERNAL=/recalbox" \
            -e "BR2_PACKAGE_OVERRIDE_FILE=/recalbox/local.mk" \
            -e "O=/recalbox/output" \
            -e "BR2_DL_DIR=/recalbox/dl" \
            -v "${HOME}/.ccache:/share/ccache" \
            recalbox-build:latest \
            make -C buildroot BR2_DL_DIR="/recalbox/dl" all 2>&1 | tee packages.log

      - name: Salvar cache packages
        uses: actions/upload-artifact@v4
        with:
          name: build-packages-${{ inputs.arch }}
          path: |
            output/
            packages.log
          retention-days: 7

  gen_image:
    name: "[5/5] Gerar Imagem"
    runs-on: ubuntu-latest
    needs: [packages, detectar_estado]
    if: needs.detectar_estado.outputs.stage != 'done'
    steps:
      - uses: actions/checkout@v4

      - name: Baixar todos os caches
        uses: actions/download-artifact@v4
        with:
          path: ./cache_temp
          pattern: "build*"
          merge-multiple: false
        continue-on-error: true

      - name: Mover caches para diretórios corretos
        run: |
          echo "=== Caches baixados ==="
          ls -la cache_temp/ 2>/dev/null || echo "No cache dir"
          
          # Mover build-packages para output
          if [ -d "cache_temp/build-packages-${{ inputs.arch }}" ]; then
            cp -r cache_temp/build-packages-${{ inputs.arch }}"/*" output/ 2>/dev/null || true
            rm -rf cache_temp/build-packages-${{ inputs.arch }}
          fi
          
          # Mover build-kernel para output
          if [ -d "cache_temp/build-kernel-${{ inputs.arch }}" ]; then
            cp -r cache_temp/build-kernel-${{ inputs.arch }}"/*" output/ 2>/dev/null || true
            rm -rf cache_temp/build-kernel-${{ inputs.arch }}
          fi
          
          # Mover buildroot-defconfig para .
          if [ -d "cache_temp/buildroot-defconfig-${{ inputs.arch }}" ]; then
            cp -r cache_temp/buildroot-defconfig-${{ inputs.arch }}"/*" . 2>/dev/null || true
            rm -rf cache_temp/buildroot-defconfig-${{ inputs.arch }}
          fi
          
          # Mover buildroot-prepare para .
          if [ -d "cache_temp/buildroot-prepare-${{ inputs.arch }}" ]; then
            cp -r cache_temp/buildroot-prepare-${{ inputs.arch }}"/*" . 2>/dev/null || true
            rm -rf cache_temp/buildroot-prepare-${{ inputs.arch }}
          fi
          
          rm -rf cache_temp
          
          echo "=== Output após mover ==="
          ls -la output/ 2>/dev/null || echo "No output dir"
          ls -la output/build/ 2>/dev/null || echo "No build dir"

      - name: Baixar cache defconfig
        uses: actions/download-artifact@v4
        with:
          name: buildroot-defconfig-${{ inputs.arch }}
          path: .
        continue-on-error: true

      - name: Corrigir permissões
        run: |
          chmod -R 777 buildroot output dl 2>/dev/null || true
          chmod +x buildroot/support/scripts/* buildroot/scripts/* 2>/dev/null || true

      - name: Build Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recalbox-build:latest

      - name: Gerar imagem
        run: |
          echo "=== Checking current directory ==="
          pwd
          ls -la
          
          echo "=== Checking output directory ==="
          ls -la output/ 2>/dev/null || echo "No output dir"
          ls -la output/build/ 2>/dev/null || echo "No build dir"
          
          chmod -R 777 output build dl 2>/dev/null || true
          docker run --rm --privileged \
            -v "$(pwd):/recalbox" \
            -w /recalbox \
            -e "ARCH=${{ needs.detectar_estado.outputs.recalbox_arch }}" \
            -e "FORCE_UNSAFE_CONFIGURE=1" \
            -e "BR2_EXTERNAL=/recalbox" \
            -e "BR2_PACKAGE_OVERRIDE_FILE=/recalbox/local.mk" \
            -e "O=/recalbox/output" \
            -e "BR2_DL_DIR=/recalbox/dl" \
            -e "USER=root" \
            -u root:root \
            recalbox-build:latest \
            /bin/bash -x /recalbox/scripts/build-image.sh
          
          echo "=== After build ==="
          ls -la output/images/ 2>/dev/null || echo "Imagem não encontrada"

      - name: Preparar artefatos
        run: |
          if [ -f "output/images/recalbox/recalbox.img" ]; then
            mkdir -p dist-${{ inputs.arch }}
            cp output/images/recalbox/* dist-${{ inputs.arch }}/
            cd dist-${{ inputs.arch }}
            sha256sum * > SHA256SUMS.txt
          else
            echo "Build output nao encontrado"
            ls -la output/images/ 2>/dev/null || echo "Diretorio output nao existe"
          fi

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: imagem-${{ inputs.arch }}
          path: dist-${{ inputs.arch }}/
          retention-days: 30

  completo:
    name: Build Completo
    runs-on: ubuntu-latest
    needs: detectar_estado
    if: needs.detectar_estado.outputs.stage == 'done'
    steps:
      - name: Verificar imagem existente
        run: |
          echo "### Build já existente!" >> $GITHUB_STEP_SUMMARY
          echo "A imagem para ${{ inputs.arch }} já foi compilada anteriormente." >> $GITHUB_STEP_SUMMARY
          echo "Acesse os artefatos para baixar." >> $GITHUB_STEP_SUMMARY
