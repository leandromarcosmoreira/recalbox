name: Recalbox Build

on:
  workflow_dispatch:
    inputs:
      skip_cache:
        description: 'Pular caches'
        required: false
        default: 'false'
        type: boolean
      force_rebuild:
        description: 'Forçar rebuild completo'
        required: false
        default: 'false'
        type: boolean
      arch:
        description: 'Arquitetura'
        required: false
        default: 'x86_64'
        type: choice
        options:
          - x86_64
          - rpi5_64
          - rpi4_64
          - rpi3
          - rpizero2
          - rg353x
          - odroidgo2

env:
  DOCKER_BUILDKIT: 1
  COMPOSE_DOCKER_CLI_BUILD: 1
  GH_CLI_VERSION: '2.65.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.arch }}
  cancel-in-progress: false

jobs:
  detectar_estado:
    name: Verificar Estado
    runs-on: ubuntu-latest
    outputs:
      stage: ${{ steps.determinar.outputs.stage }}
      has_image: ${{ steps.determinar.outputs.has_image }}
      has_packages: ${{ steps.determinar.outputs.has_packages }}
      has_kernel: ${{ steps.determinar.outputs.has_kernel }}
      has_defconfig: ${{ steps.determinar.outputs.has_defconfig }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar artefatos existentes
        id: verificar
        run: |
          echo "Verificando artefatos para ${{ inputs.arch }}..."
          
          # Verificar cada estágio
          for stage in prepare defconfig kernel packages image; do
            echo "Checking $stage..."
          done

      - name: Determinar próximo estágio
        id: determinar
        run: |
          echo "Determinando estágio inicial..."
          
          # Verificar se tem imagem final
          if curl -sL "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" | grep -q "imagem-${{ inputs.arch }}"; then
            echo "has_image=true" >> $GITHUB_OUTPUT
            echo "Imagem já existe!"
            echo "stage=done" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_image=false" >> $GITHUB_OUTPUT
          
          # Verificar packages
          if curl -sL "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" | grep -q "build-packages-${{ inputs.arch }}"; then
            echo "has_packages=true" >> $GITHUB_OUTPUT
            echo "stage=5-image" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_packages=false" >> $GITHUB_OUTPUT
          
          # Verificar kernel
          if curl -sL "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" | grep -q "build-kernel-${{ inputs.arch }}"; then
            echo "has_kernel=true" >> $GITHUB_OUTPUT
            echo "stage=4-packages" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_kernel=false" >> $GITHUB_OUTPUT
          
          # Verificar defconfig
          if curl -sL "https://api.github.com/repos/${{ github.repository }}/actions/artifacts" | grep -q "buildroot-defconfig-${{ inputs.arch }}"; then
            echo "has_defconfig=true" >> $GITHUB_OUTPUT
            echo "stage=3-kernel" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "has_defconfig=false" >> $GITHUB_OUTPUT
          
          echo "stage=1-prepare" >> $GITHUB_OUTPUT

  1-prepare:
    name: "[1/5] Preparar Ambiente"
    runs-on: ubuntu-latest
    needs: detectar_estado
    if: needs.detectar_estado.outputs.stage == '1-prepare' || needs.detectar_estado.outputs.stage == '2-defconfig' || needs.detectar_estado.outputs.stage == '3-kernel' || needs.detectar_estado.outputs.stage == '4-packages' || needs.detectar_estado.outputs.stage == '5-image'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar cache existente
        uses: actions/download-artifact@v4
        with:
          name: buildroot-prepare-${{ inputs.arch }}
          path: . 
        continue-on-error: true

      - name: Clonar/Verificar buildroot
        run: |
          if [ ! -d "buildroot" ] || [ ! -f "buildroot/Makefile" ]; then
            echo "Clonando buildroot..."
            rm -rf buildroot
            git clone --depth 1 --branch 2024.02 https://git.busybox.net/buildroot buildroot
            cd buildroot
            git fetch --depth 1 origin e4a5ab3b319753f41e2b5cf22e90b6b0304ca225
            git checkout e4a5ab3b319753f41e2b5cf22e90b6b0304ca225
            cd ..
          else
            echo "Buildroot já existe, reutilizando..."
          fi
          
          chmod +x buildroot/support/scripts/* buildroot/scripts/* 2>/dev/null || true
          mkdir -p output dl

      - name: Criar cache
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-prepare-${{ inputs.arch }}
          path: |
            buildroot/
            output/
            dl/
          retention-days: 7

  2-defconfig:
    name: "[2/5] Configurar Build"
    runs-on: ubuntu-latest
    needs: [1-prepare, detectar_estado]
    if: needs.detectar_estado.outputs.stage == '2-defconfig' || needs.detectar_estado.outputs.stage == '3-kernel' || needs.detectar_estado.outputs.stage == '4-packages' || needs.detectar_estado.outputs.stage == '5-image'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar cache prepare
        uses: actions/download-artifact@v4
        with:
          name: buildroot-prepare-${{ inputs.arch }}
          path: .
        continue-on-error: true

      - name: Baixar cache defconfig existente
        uses: actions/download-artifact@v4
        with:
          name: buildroot-defconfig-${{ inputs.arch }}
          path: .
        continue-on-error: true

      - name: Build Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recalbox-build:latest
          cache-from: type=gha,scope=recalbox
          cache-to: type=gha,mode=max,scope=recalbox

      - name: Executar defconfig
        if: needs.detectar_estado.outputs.has_defconfig != 'true'
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -v "$(pwd):/recalbox" \
            -w /recalbox \
            -e "ARCH=${{ inputs.arch }}" \
            -e "BR2_EXTERNAL=/recalbox" \
            -e "BR2_PACKAGE_OVERRIDE_FILE=/recalbox/local.mk" \
            -e "O=/recalbox/output" \
            -e "BR2_DL_DIR=/recalbox/dl" \
            recalbox-build:latest \
            make recalbox-${{ inputs.arch }}_defconfig 2>&1 | tee defconfig.log

      - name: Salvar cache defconfig
        uses: actions/upload-artifact@v4
        with:
          name: buildroot-defconfig-${{ inputs.arch }}
          path: |
            output/.config
            output/Makefile
            defconfig.log
          retention-days: 7

  3-kernel:
    name: "[3/5] Compilar Kernel"
    runs-on: ubuntu-latest
    needs: [2-defconfig, detectar_estado]
    if: needs.detectar_estado.outputs.stage == '3-kernel' || needs.detectar_estado.outputs.stage == '4-packages' || needs.detectar_estado.outputs.stage == '5-image'
    steps:
      - uses: actions/checkout@v4

      - name: Baixar caches
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: buildroot-*
          merge-multiple: true
        continue-on-error: true

      - name: Build Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recalbox-build:latest

      - name: Compilar kernel
        if: needs.detectar_estado.outputs.has_kernel != 'true'
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -v "$(pwd):/recalbox" \
            -w /recalbox \
            -e "ARCH=${{ inputs.arch }}" \
            -e "FORCE_UNSAFE_CONFIGURE=1" \
            -e "BR2_EXTERNAL=/recalbox" \
            -e "BR2_PACKAGE_OVERRIDE_FILE=/recalbox/local.mk" \
            -e "O=/recalbox/output" \
            -e "BR2_DL_DIR=/recalbox/dl" \
            -v "${HOME}/.ccache:/share/ccache" \
            recalbox-build:latest \
            make -C buildroot BR2_DL_DIR="/recalbox/dl" linux 2>&1 | tee kernel.log

      - name: Salvar cache kernel
        uses: actions/upload-artifact@v4
        with:
          name: build-kernel-${{ inputs.arch }}
          path: |
            output/build/
            kernel.log
          retention-days: 7

  4-packages:
    name: "[4/5] Compilar Pacotes"
    runs-on: ubuntu-latest
    needs: [3-kernel, detectar_estado]
    if: needs.detectar_estado.outputs.stage == '4-packages' || needs.detectar_estado.outputs.stage == '5-image'
    steps:
      - uses: actions/checkout@v4

      - name: Baixar todos os caches
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: build*
          merge-multiple: true
        continue-on-error: true

      - name: Build Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recalbox-build:latest

      - name: Compilar pacotes
        if: needs.detectar_estado.outputs.has_packages != 'true'
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -v "$(pwd):/recalbox" \
            -w /recalbox \
            -e "ARCH=${{ inputs.arch }}" \
            -e "FORCE_UNSAFE_CONFIGURE=1" \
            -e "RECALBOX_CCACHE_ENABLED=1" \
            -e "BR2_EXTERNAL=/recalbox" \
            -e "BR2_PACKAGE_OVERRIDE_FILE=/recalbox/local.mk" \
            -e "O=/recalbox/output" \
            -e "BR2_DL_DIR=/recalbox/dl" \
            -v "${HOME}/.ccache:/share/ccache" \
            recalbox-build:latest \
            make -C buildroot BR2_DL_DIR="/recalbox/dl" 2>&1 | tee packages.log

      - name: Salvar cache packages
        uses: actions/upload-artifact@v4
        with:
          name: build-packages-${{ inputs.arch }}
          path: |
            output/build/
            packages.log
          retention-days: 7

  5-image:
    name: "[5/5] Gerar Imagem"
    runs-on: ubuntu-latest
    needs: [4-packages, detectar_estado]
    if: needs.detectar_estado.outputs.stage == '5-image'
    steps:
      - uses: actions/checkout@v4

      - name: Baixar todos os caches
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: build*
          merge-multiple: true
        continue-on-error: true

      - name: Build Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: recalbox-build:latest

      - name: Gerar imagem
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -v "$(pwd):/recalbox" \
            -w /recalbox \
            -e "ARCH=${{ inputs.arch }}" \
            -e "BR2_EXTERNAL=/recalbox" \
            -e "BR2_PACKAGE_OVERRIDE_FILE=/recalbox/local.mk" \
            -e "O=/recalbox/output" \
            -e "BR2_DL_DIR=/recalbox/dl" \
            recalbox-build:latest \
            make -C buildroot BR2_DL_DIR="/recalbox/dl" RECALBOX_IMAGES="recalbox" 2>&1 | tee image.log

      - name: Preparar artefatos
        run: |
          if [ -f "output/images/recalbox/recalbox.img" ]; then
            mkdir -p dist-${{ inputs.arch }}
            cp output/images/recalbox/* dist-${{ inputs.arch }}/
            cp image.log dist-${{ inputs.arch }}/
            cd dist-${{ inputs.arch }}
            sha256sum * > SHA256SUMS.txt
          else
            echo "Build output nao encontrado"
            ls -la output/images/ 2>/dev/null || echo "Diretorio output nao existe"
          fi

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: imagem-${{ inputs.arch }}
          path: dist-${{ inputs.arch }}/
          retention-days: 30

  completo:
    name: Build Completo
    runs-on: ubuntu-latest
    needs: [5-image, detectar_estado]
    if: needs.detectar_estado.outputs.stage == 'done'
    steps:
      - name: Verificar imagem existente
        run: |
          echo "### Build já existente!" >> $GITHUB_STEP_SUMMARY
          echo "A imagem para ${{ inputs.arch }} já foi compilada anteriormente." >> $GITHUB_STEP_SUMMARY
          echo "Acesse os artefatos para baixar." >> $GITHUB_STEP_SUMMARY
