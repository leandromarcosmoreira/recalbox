<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recalbox Builds - Download Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 40px 0;
            border-bottom: 2px solid #e94560;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #e94560;
        }
        
        .subtitle {
            color: #a0a0a0;
            font-size: 1.1rem;
        }
        
        .build-info {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
        }
        
        .build-info h2 {
            color: #e94560;
            margin-bottom: 15px;
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }
        
        .info-item {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
        }
        
        .info-label {
            color: #a0a0a0;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
        
        .info-value {
            font-size: 1.1rem;
            font-weight: bold;
        }
        
        .releases-section {
            margin-top: 40px;
        }
        
        .releases-section h2 {
            color: #e94560;
            margin-bottom: 20px;
        }
        
        .release-card {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .release-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.2);
        }
        
        .release-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .release-title {
            font-size: 1.3rem;
            color: #e94560;
        }
        
        .release-date {
            color: #a0a0a0;
            font-size: 0.9rem;
        }
        
        .download-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .download-table th,
        .download-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .download-table th {
            color: #a0a0a0;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        
        .download-btn {
            display: inline-block;
            background: #e94560;
            color: white;
            padding: 8px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .download-btn:hover {
            background: #ff6b6b;
        }
        
        .checksum {
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            color: #a0a0a0;
            word-break: break-all;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #a0a0a0;
        }
        
        .error {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .refresh-btn {
            background: transparent;
            border: 2px solid #e94560;
            color: #e94560;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 20px;
            transition: all 0.2s;
        }
        
        .refresh-btn:hover {
            background: #e94560;
            color: white;
        }
        
        .arch-selector {
            margin-top: 20px;
        }
        
        .arch-selector label {
            margin-right: 10px;
            color: #a0a0a0;
        }
        
        .arch-selector select {
            background: #1a1a2e;
            color: #fff;
            border: 2px solid #e94560;
            padding: 8px 16px;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
        }
        
        .arch-selector select:hover {
            background: #e94560;
        }
        
        .arch-badge {
            background: #e94560;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            margin-left: 8px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .download-table {
                font-size: 0.9rem;
            }
            
            .download-table th,
            .download-table td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Recalbox Builds</h1>
            <p class="subtitle">Download Center</p>
            
            <div class="arch-selector">
                <label for="archSelect">Architecture:</label>
                <select id="archSelect" onchange="filterByArchitecture()">
                    <option value="all">All</option>
                    <option value="x86_64">x86_64 (PC)</option>
                    <option value="rpi5_64">Raspberry Pi 5</option>
                </select>
            </div>
        </header>

        <div id="content">
            <div class="loading">Loading releases...</div>
        </div>
    </div>

    <script>
        const REPO_OWNER = 'recalbox';
        const REPO_NAME = 'recalbox';
        
        const ARCH_LABELS = {
            'x86_64': 'x86_64 (PC)',
            'rpi5_64': 'Raspberry Pi 5'
        };
        
        async function fetchReleases() {
            const contentDiv = document.getElementById('content');
            
            try {
                const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/releases?per_page=20`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const releases = await response.json();
                
                if (releases.length === 0) {
                    contentDiv.innerHTML = `
                        <div class="error">
                            <h3>No releases found</h3>
                            <p>There are no builds available yet.</p>
                        </div>
                    `;
                    return;
                }
                
                let html = `
                    <div class="build-info">
                        <h2>Latest Build Information</h2>
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">Total Releases</div>
                                <div class="info-value">${releases.length}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Latest Version</div>
                                <div class="info-value">${releases[0].tag_name}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">Latest Build Date</div>
                                <div class="info-value">${new Date(releases[0].published_at).toLocaleDateString()}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="releases-section">
                        <h2>Available Downloads <span id="visible-count" style="font-size: 0.8em; color: #a0a0a0;">(${releases.length})</span></h2>
                `;
                
                for (const release of releases) {
                    if (release.draft || release.prerelease) continue;
                    
                    const assets = release.assets.filter(a => 
                        a.name.endsWith('.img') || 
                        a.name.endsWith('.img.zip') ||
                        a.name.endsWith('.tar.gz') ||
                        a.name.endsWith('.zip')
                    );
                    
                    if (assets.length === 0) continue;
                    
                    const arch = getArchFromTag(release.tag_name);
                    const archLabel = arch ? (ARCH_LABELS[arch] || arch) : 'Unknown';
                    
                    html += `
                        <div class="release-card" data-arch="${arch || 'unknown'}">
                            <div class="release-header">
                                <span class="release-title">${release.tag_name} <span class="arch-badge">${archLabel}</span></span>
                                <span class="release-date">${new Date(release.published_at).toLocaleString()}</span>
                            </div>
                            <p>${release.body || 'No description available.'}</p>
                            <table class="download-table">
                                <thead>
                                    <tr>
                                        <th>File</th>
                                        <th>Size</th>
                                        <th>Download</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;
                    
                    for (const asset of assets) {
                        const size = formatSize(asset.size);
                        html += `
                            <tr>
                                <td>${asset.name}</td>
                                <td>${size}</td>
                                <td><a href="${asset.browser_download_url}" class="download-btn" download>Download</a></td>
                            </tr>
                        `;
                    }
                    
                    html += `
                                </tbody>
                            </table>
                        </div>
                    `;
                }
                
                html += `
                    </div>
                    <button class="refresh-btn" onclick="fetchReleases()">Refresh</button>
                `;
                
                contentDiv.innerHTML = html;
                
            } catch (error) {
                contentDiv.innerHTML = `
                    <div class="error">
                        <h3>Error Loading Releases</h3>
                        <p>${error.message}</p>
                        <button class="refresh-btn" onclick="fetchReleases()">Try Again</button>
                    </div>
                `;
            }
        }
        
        function formatSize(bytes) {
            const units = ['B', 'KB', 'MB', 'GB'];
            let size = bytes;
            let unitIndex = 0;
            
            while (size >= 1024 && unitIndex < units.length - 1) {
                size /= 1024;
                unitIndex++;
            }
            
            return `${size.toFixed(1)} ${units[unitIndex]}`;
        }
        
        function getArchFromTag(tagName) {
            if (tagName.startsWith('x86_64')) return 'x86_64';
            if (tagName.startsWith('rpi5_64')) return 'rpi5_64';
            return null;
        }
        
        function filterByArchitecture() {
            const selectedArch = document.getElementById('archSelect').value;
            const releaseCards = document.querySelectorAll('.release-card');
            
            releaseCards.forEach(card => {
                const arch = card.dataset.arch;
                if (selectedArch === 'all' || arch === selectedArch) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
            
            updateCounts();
        }
        
        function updateCounts() {
            const selectedArch = document.getElementById('archSelect').value;
            const releaseCards = document.querySelectorAll('.release-card');
            let visibleCount = 0;
            
            releaseCards.forEach(card => {
                const arch = card.dataset.arch;
                if (selectedArch === 'all' || arch === selectedArch) {
                    visibleCount++;
                }
            });
            
            const countEl = document.getElementById('visible-count');
            if (countEl) {
                countEl.textContent = visibleCount;
            }
        }
        
        fetchReleases();
    </script>
</body>
</html>
